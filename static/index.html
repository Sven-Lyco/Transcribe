<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="color-scheme" content="dark">
<title>Whisper Transkription</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="container">
  <header class="top">
    <div>
      <h1>Whisper Transkription</h1>
      <p class="subtitle" id="subtitle">// lokal · kein API-Key · kein Internet</p>
    </div>
    <button class="ghost-btn icon-btn" id="settingsBtn" aria-expanded="false" aria-controls="settings" title="Einstellungen" aria-label="Einstellungen">⚙︎</button>
  </header>

  <section class="panel" id="settings" hidden>
    <div class="field" id="tokenField" hidden>
      <label for="token">Token</label>
      <input type="password" id="token" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="TRANSCRIBE_TOKEN des Servers">
    </div>
    <div class="row">
      <div class="field">
        <label for="model">Modell</label>
        <select id="model"></select>
      </div>
      <div class="field">
        <label for="language">Sprache</label>
        <select id="language">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
          <option value="auto">Auto-detect</option>
        </select>
      </div>
    </div>
    <div class="hint" id="modelHint"></div>
    <div class="field" id="outputFolderField">
      <label for="outputFolder">Ausgabeordner</label>
      <input type="text" id="outputFolder" placeholder="Pfad zum Zielordner (leer = transcriptions/)">
    </div>
    <div class="row">
      <button class="ghost-btn" id="exportBtn" type="button">Verlauf exportieren</button>
      <label class="button ghost-btn" for="importInput">Verlauf importieren</label>
      <input type="file" id="importInput" accept="application/json,.json" hidden>
    </div>
    <div class="hint" id="settingsMsg"></div>
  </section>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept="audio/*,.ogg,.mp3,.wav,.m4a,.opus,.webm">
    <span class="drop-icon">🎙</span>
    <div class="drop-text">
      <span class="pointer-only"><strong>Audiodatei hierher ziehen</strong><br>oder klicken zum Auswählen</span>
      <span class="touch-only"><strong>Audiodatei auswählen</strong></span>
    </div>
    <div class="file-info" id="fileInfo"></div>
  </div>

  <div class="row start-row">
    <div class="field">
      <label for="speakerName">Name (optional)</label>
      <input type="text" id="speakerName" placeholder="z.B. Max Mustermann">
    </div>
    <button id="startBtn" disabled>Starten</button>
  </div>
  <div class="summary" id="summary"></div>

  <div class="jobs" id="jobs" aria-live="polite"></div>

  <section class="history">
    <div class="section-head">
      <span class="section-label">Verlauf</span>
      <span class="hint" id="historyCount"></span>
    </div>
    <p class="empty" id="emptyState">Noch keine Transkripte.<br><span id="emptyHint">Wähle oben eine Audiodatei aus.</span></p>
    <ol class="history-list" id="historyList"></ol>
  </section>
</div>

<script src="/app.js"></script>
</body>
</html>
