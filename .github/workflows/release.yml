# Baut Transcribe.app (Apple Silicon) und veröffentlicht das DMG.
#   - Tag vX.Y.Z pushen: GitHub Release mit DMG, FFmpeg-Quelltext und Prüfsummen
#   - Manuell starten (Actions -> Run workflow): nur Testbuild, DMG als Artifact
#
# Nur der Job "release" darf ins Repository schreiben; er läuft nur bei Tags und führt
# keinen Code aus dem Repository aus. Actions sind auf Commits gepinnt, Dependabot hält sie aktuell.
name: macOS App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: macos-15  # Apple Silicon
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Tag, VERSION und CHANGELOG abgleichen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/^VERSION = "\(.*\)".*/\1/p' transcribe.py)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu VERSION = \"$VERSION\" in transcribe.py"
            exit 1
          fi
          # Abschnitt "## [X.Y.Z] …" bis zum nächsten "## [" aus dem CHANGELOG holen
          mkdir -p dist
          awk -v v="[$VERSION]" '/^## \[/ { if (found) exit; found = index($0, v) > 0; next } found' CHANGELOG.md > dist/changes.md
          if ! grep -q '[^[:space:]]' dist/changes.md; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt für $VERSION"
            exit 1
          fi
          { echo "## What's new"; cat dist/changes.md; echo; cat packaging/macos/release-notes.md; } > dist/release-notes.md

      - name: App und DMG bauen
        env:
          PYTHON: python
        run: packaging/macos/build.sh

      # Die LGPL verlangt, den Quelltext des mitgelieferten FFmpeg zusammen mit der App anzubieten
      - name: FFmpeg-Quelltext und Prüfsummen
        run: |
          cp build/ffmpeg-src/ffmpeg-*.tar.xz dist/
          cd dist && shasum -a 256 *.dmg ffmpeg-*.tar.xz > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Transcribe-macOS
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/ffmpeg-*.tar.xz
            dist/SHA256SUMS.txt
            dist/release-notes.md

  release:
    needs: build
    if: github.event_name == 'push'  # Tag gepusht; ein manueller Start, auch auf einem Tag, veröffentlicht nichts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: Transcribe-macOS
          path: dist

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/ffmpeg-*.tar.xz dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Transcribe $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            --generate-notes
